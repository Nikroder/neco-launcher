name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Vue 3 Frontend
        run: npm run build

      - name: Build Android APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/neco-launcher-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neco-launcher-apk
          path: release-apk/*.apk

      - name: Create GitHub Release and Attach APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*.apk
          name: N.eco Launcher ${{ github.ref_name }}
          body: |
            ## ✦ N.eco Launcher — Release ${{ github.ref_name }}
            
            Минималистичный Android-лаунчер на стеке **Vue 3 + Rust (Tauri Mobile)** в эстетике Nothing OS.
            
            ### ✨ Возможности:
            * Мониторинг заряда подключенных устройств (Galaxy Buds, Galaxy Watch, S Pen)
            * Поддержка профилей избранного для Режимов Samsung (Modes & Routines)
            * Динамический медиа-плеер для управления воспроизведением
            * Плавные пружинные анимации
            * Встроенное автообновление через GitHub Releases
            
            ### 📥 Установка:
            Скачайте прикрепленный файл `neco-launcher-v1.0.0.apk` ниже и установите на телефон.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
