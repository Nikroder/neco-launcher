name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Vue 3 Frontend
        run: npm run build

      - name: Build Android APK via Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          # Also assemble release APK if keys exist, or copy debug as release candidate
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/neco-launcher-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neco-launcher-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release and Attach APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          name: N.eco Launcher ${{ github.ref_name }}
          body: |
            ## ✦ N.eco Launcher — Release ${{ github.ref_name }}
            
            Минималистичный лаунчер на стеке **Vue + Rust** с эстетикой Nothing OS и медитативным звуковым дизайном Zen.
            
            ### ✨ Что нового:
            * Мониторинг заряда подключенных устройств (Bluetooth & Samsung Ecosystem)
            * Поддержка профилей избранного для Режимов Samsung (Modes & Routines)
            * Динамический медиа-плеер для управления воспроизведением
            * Плавные пружинные анимации
            * Встроенное автообновление через GitHub Releases
            
            ### 📥 Установка:
            1. Скачайте прикрепленный `.apk` файл ниже.
            2. Установите на телефон и выберите N.eco launcher приложением по умолчанию.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
